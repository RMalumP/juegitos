# Pruebas en cada PR y en cada push a main: motores (Node) y pruebas de navegador básicas
# (app instalable y sin conexión, regresión de los juegos y mejoras).
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:pwa
      - run: npm run test:regresion
      - run: npm run test:mejoras
      - run: npm run test:guardar
